name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-and-jvm:
    name: Android and JVM checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile Android targets
        run: ./gradlew --no-daemon :core:compileDebugKotlinAndroid :render:compileDebugKotlinAndroid :composeApp:compileDebugKotlinAndroid

      - name: Run JVM tests
        run: ./gradlew --no-daemon :draw:jvmTest :geocore:jvmTest :spatial-index:jvmTest

      - name: Run Android unit tests
        run: ./gradlew --no-daemon :core:testDebugUnitTest :render:testDebugUnitTest :composeApp:testDebugUnitTest
