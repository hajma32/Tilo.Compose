build:
  maxIssues: 0
  excludeCorrectable: false

config:
  validation: true
  warningsAsErrors: true
  checkExhaustiveness: false

complexity:
  LongMethod:
    threshold: 120
  LongParameterList:
    functionThreshold: 15
    constructorThreshold: 20
    ignoreDefaultParameters: true
    ignoreDataClasses: true
    ignoreAnnotatedParameter:
      - 'Composable'
  LargeClass:
    threshold: 1200
  CyclomaticComplexMethod:
    threshold: 25
  NestedBlockDepth:
    threshold: 5
  TooManyFunctions:
    thresholdInFiles: 40
    thresholdInClasses: 40
    thresholdInInterfaces: 30
    thresholdInObjects: 40
    thresholdInEnums: 30
    ignorePrivate: false
    ignoreOverridden: true
    ignoreAnnotatedFunctions:
      - 'Composable'

naming:
  FunctionNaming:
    # Ktlint enforces lower camel case while allowing @Composable entry points.
    # Detekt 1.x cannot express that annotation exception, so it accepts both here.
    functionPattern: '[a-zA-Z][a-zA-Z0-9]*'

style:
  MagicNumber:
    active: false
  MaxLineLength:
    active: false
  ReturnCount:
    max: 4
    excludeGuardClauses: true
  ThrowsCount:
    max: 4
    excludeGuardClauses: true

# You can extend this config with project-specific rules later.
